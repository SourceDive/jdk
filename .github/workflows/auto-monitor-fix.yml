name: Auto Monitor and Fix

on:
  workflow_run:
    workflows: ["Build JDK"]
    types: [completed, failed]
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟检查一次
  workflow_dispatch:

jobs:
  monitor-and-fix:
    name: 监控和自动修复
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 检查工作流状态
        id: check-status
        run: |
          echo "=== 检查工作流状态 ==="
          
          # 获取最新的 Build JDK 工作流运行
          RUNS=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Build JDK") | select(.created_at > (now - 3600)) | .id' \
            --limit 5)
          
          echo "最近的工作流运行: $RUNS"
          
          for run_id in $RUNS; do
            echo "检查运行 ID: $run_id"
            
            # 获取运行详情
            RUN_INFO=$(gh api repos/${{ github.repository }}/actions/runs/$run_id)
            STATUS=$(echo "$RUN_INFO" | jq -r '.status')
            CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion // "null"')
            
            echo "运行 $run_id: 状态=$STATUS, 结论=$CONCLUSION"
            
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "发现失败的工作流: $run_id"
              echo "failed-run-id=$run_id" >> $GITHUB_OUTPUT
              echo "has-failure=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          
          if [ -z "${{ steps.check-status.outputs.has-failure }}" ]; then
            echo "所有工作流都成功运行"
            echo "has-failure=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 分析失败原因
        if: steps.check-status.outputs.has-failure == 'true'
        id: analyze-error
        run: |
          echo "=== 分析失败原因 ==="
          
          FAILED_RUN_ID="${{ steps.check-status.outputs.failed-run-id }}"
          echo "分析失败的工作流: $FAILED_RUN_ID"
          
          # 获取失败的 job
          JOBS=$(gh api repos/${{ github.repository }}/actions/runs/$FAILED_RUN_ID/jobs \
            --jq '.jobs[] | select(.conclusion == "failure")')
          
          JOB_ID=$(echo "$JOBS" | jq -r '.id' | head -1)
          echo "失败的 Job ID: $JOB_ID"
          
          if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
            # 获取错误日志
            echo "获取错误日志..."
            gh api repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs > error_log.txt
            
            # 分析错误类型
            echo "分析错误类型..."
            
            if grep -q "configure: error: unrecognized option" error_log.txt; then
              echo "error-type=configure-option" >> $GITHUB_OUTPUT
              echo "检测到 configure 选项错误"
            elif grep -q "Permission denied" error_log.txt; then
              echo "error-type=permission" >> $GITHUB_OUTPUT
              echo "检测到权限错误"
            elif grep -q "autoconf" error_log.txt && grep -q "not found" error_log.txt; then
              echo "error-type=missing-dependency" >> $GITHUB_OUTPUT
              echo "检测到缺失依赖错误"
            elif grep -q "No space left on device" error_log.txt; then
              echo "error-type=disk-space" >> $GITHUB_OUTPUT
              echo "检测到磁盘空间错误"
            elif grep -q "timeout" error_log.txt; then
              echo "error-type=timeout" >> $GITHUB_OUTPUT
              echo "检测到超时错误"
            else
              echo "error-type=unknown" >> $GITHUB_OUTPUT
              echo "检测到未知错误"
            fi
            
            # 提取关键错误信息
            ERROR_SUMMARY=$(grep -E "(error|Error|ERROR)" error_log.txt | head -10 | tr '\n' ' ')
            echo "error-summary=$ERROR_SUMMARY" >> $GITHUB_OUTPUT
          else
            echo "error-type=no-job-info" >> $GITHUB_OUTPUT
            echo "无法获取失败的 job 信息"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 自动修复错误
        if: steps.check-status.outputs.has-failure == 'true'
        run: |
          echo "=== 自动修复错误 ==="
          
          ERROR_TYPE="${{ steps.analyze-error.outputs.error-type }}"
          echo "修复错误类型: $ERROR_TYPE"
          
          case "$ERROR_TYPE" in
            "configure-option")
              echo "修复 configure 选项错误..."
              
              # 修复 configure 参数
              sed -i 's/-O[0-9]/-O2/g' .github/workflows/build-jdk.yml
              sed -i '/--with-memory-size/d' .github/workflows/build-jdk.yml
              
              # 确保 configure 参数格式正确
              sed -i 's/--with-extra-cflags="-Wno-error -O2 "/--with-extra-cflags="-Wno-error -O2"/g' .github/workflows/build-jdk.yml
              sed -i 's/--with-extra-cxxflags="-Wno-error -O2 "/--with-extra-cxxflags="-Wno-error -O2"/g' .github/workflows/build-jdk.yml
              
              echo "✅ configure 选项已修复"
              ;;
              
            "permission")
              echo "修复权限错误..."
              
              # 确保脚本有执行权限
              chmod +x configure
              chmod +x make/autoconf/configure
              
              # 添加权限修复步骤到工作流
              cat >> .github/workflows/build-jdk.yml << 'EOF'
      
      - name: 修复权限
        run: |
          chmod +x configure
          chmod +x make/autoconf/configure
          chmod -R 755 build/ 2>/dev/null || true
EOF
              
              echo "✅ 权限问题已修复"
              ;;
              
            "missing-dependency")
              echo "修复依赖错误..."
              
              # 更新依赖安装步骤
              sed -i '/apt-get install -y/a\            autoconf \\' .github/workflows/build-jdk.yml
              
              echo "✅ 依赖问题已修复"
              ;;
              
            "disk-space")
              echo "修复磁盘空间错误..."
              
              # 添加磁盘清理步骤
              cat >> .github/workflows/build-jdk.yml << 'EOF'
      
      - name: 清理磁盘空间
        run: |
          sudo apt clean
          sudo apt autoremove -y
          rm -rf /tmp/*
          df -h
EOF
              
              echo "✅ 磁盘空间问题已修复"
              ;;
              
            "timeout")
              echo "修复超时错误..."
              
              # 增加超时时间
              sed -i 's/timeout-minutes: [0-9]*/timeout-minutes: 120/g' .github/workflows/build-jdk.yml
              
              # 减少并行度
              sed -i 's/optimal-jobs=\${{ steps.machine-config.outputs.optimal-jobs }}/optimal-jobs=2/g' .github/workflows/build-jdk.yml
              
              echo "✅ 超时问题已修复"
              ;;
              
            *)
              echo "应用通用修复..."
              
              # 通用修复：清理构建目录
              rm -rf build/
              
              # 添加通用错误处理
              cat >> .github/workflows/build-jdk.yml << 'EOF'
      
      - name: 通用错误处理
        if: failure()
        run: |
          echo "工作流失败，执行清理和重试准备..."
          rm -rf build/
          df -h
          free -h
EOF
              
              echo "✅ 通用修复已应用"
              ;;
          esac
      
      - name: 提交修复
        if: steps.check-status.outputs.has-failure == 'true'
        run: |
          echo "=== 提交修复 ==="
          
          # 配置 git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加修改
          git add .
          
          # 提交修复
          git commit -m "Auto-fix: 修复 ${{ steps.analyze-error.outputs.error-type }} 错误

          错误摘要: ${{ steps.analyze-error.outputs.error-summary }}
          
          自动修复时间: $(date '+%Y-%m-%d %H:%M:%S')
          失败的工作流: ${{ steps.check-status.outputs.failed-run-id }}" || true
          
          # 推送到远程
          git push origin HEAD || true
          
          echo "✅ 修复已提交并推送"
      
      - name: 重新触发工作流
        if: steps.check-status.outputs.has-failure == 'true'
        run: |
          echo "=== 重新触发工作流 ==="
          
          # 获取工作流 ID
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[] | select(.name == "Build JDK") | .id')
          
          if [ -n "$WORKFLOW_ID" ]; then
            # 重新触发工作流
            gh workflow run $WORKFLOW_ID --repo ${{ github.repository }}
            echo "✅ 工作流已重新触发"
          else
            echo "❌ 无法找到工作流 ID"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 发送通知
        if: always()
        run: |
          echo "=== 监控结果 ==="
          
          if [ "${{ steps.check-status.outputs.has-failure }}" = "true" ]; then
            echo "🔧 发现失败的工作流并已自动修复"
            echo "失败类型: ${{ steps.analyze-error.outputs.error-type }}"
            echo "已重新触发工作流"
          else
            echo "✅ 所有工作流运行正常"
          fi
          
          echo "监控完成时间: $(date '+%Y-%m-%d %H:%M:%S')"