name: Build JDK (改进版)

on:
  push:
    branches:
      - '**'  # 在所有分支上触发

jobs:
  build:
    name: 编译 JDK
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:x86_64-ubuntu-jdk-11.0.11_9
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 确保使用一致的换行符
          core.autocrlf: false
      
      - name: 计算源代码哈希 (改进版)
        id: source-hash
        run: |
          # 方案1: 使用 Git 的 tree 哈希，更稳定
          GIT_HASH=$(git rev-parse HEAD:src HEAD:make | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "git-hash=${GIT_HASH}" >> $GITHUB_OUTPUT
          
          # 方案2: 改进的文件内容哈希（忽略时间戳和权限）
          FILE_HASH=$(find src make -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.gmk" -o -name "*.mk" \) -print0 | \
            sort -z | \
            xargs -0 sha256sum | \
            awk '{print $1}' | \
            sha256sum | \
            cut -d' ' -f1 | \
            cut -c1-16)
          echo "file-hash=${FILE_HASH}" >> $GITHUB_OUTPUT
          
          # 添加构建配置哈希
          CONFIG_HASH=$(echo "release-no-warnings" | sha256sum | cut -d' ' -f1 | cut -c1-8)
          echo "config-hash=${CONFIG_HASH}" >> $GITHUB_OUTPUT
          
          echo "Git 哈希: ${GIT_HASH}"
          echo "文件哈希: ${FILE_HASH}"
          echo "配置哈希: ${CONFIG_HASH}"
      
      - name: 恢复构建缓存 (多级缓存策略)
        id: cache-build
        uses: actions/cache@v3
        with:
          path: |
            build/
            ~/.ccache
          # 主键：包含完整的哈希信息
          key: jdk-build-v2-${{ runner.os }}-${{ steps.source-hash.outputs.git-hash }}-${{ steps.source-hash.outputs.config-hash }}
          # 恢复键：逐级放宽匹配条件
          restore-keys: |
            jdk-build-v2-${{ runner.os }}-${{ steps.source-hash.outputs.git-hash }}-
            jdk-build-v2-${{ runner.os }}-
      
      - name: 恢复依赖缓存
        uses: actions/cache@v3
        with:
          path: |
            /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/build-jdk-improved.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      
      - name: 显示缓存状态
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "🎯 完全缓存命中！将执行增量编译"
            echo "命中的缓存键: ${{ steps.cache-build.outputs.cache-matched-key }}"
          else
            if [ -n "${{ steps.cache-build.outputs.cache-matched-key }}" ]; then
              echo "🔄 部分缓存命中，使用恢复键: ${{ steps.cache-build.outputs.cache-matched-key }}"
            else
              echo "📦 无缓存，将执行完整编译"
            fi
          fi
          
          if [ -d build ]; then
            echo "缓存的构建目录信息:"
            echo "- 大小: $(du -sh build/ | cut -f1)"
            echo "- 修改时间: $(stat -c %y build/)"
            echo "- 文件数量: $(find build -type f | wc -l)"
          fi
      
      - name: 安装构建依赖
        run: |
          # 使用缓存友好的安装方式
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            zip \
            unzip \
            file \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libffi-dev \
            ccache
          
          # 配置 ccache
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=2G
          ccache --show-stats
      
      - name: 显示环境信息
        run: |
          echo "=== 环境信息 ==="
          echo "Java 版本:"
          java -version
          echo -e "\n可用磁盘空间:"
          df -h | grep -E "Filesystem|/$"
          echo -e "\n内存信息:"
          free -h
          echo -e "\nCPU 信息:"
          nproc
          echo -e "\nccache 状态:"
          ccache --show-stats || true
      
      - name: 配置构建
        # 即使缓存命中也运行配置，但会很快完成
        run: |
          # 设置 ccache
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          # 如果已有配置且源代码未变，configure 会快速完成
          if [ -f build/*/spec.gmk ] && [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "检测到已有配置，尝试快速重配置..."
          fi
          
          bash configure \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --with-extra-cflags="-Wno-error" \
            --with-extra-cxxflags="-Wno-error" \
            --with-extra-ldflags="-Wl,-z,noexecstack" \
            --with-cacerts-file=/etc/ssl/certs/ca-certificates.crt
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          JAVAC_FLAGS: "-encoding UTF-8"
      
      - name: 显示配置信息
        run: |
          if [ -f build/*/spec.gmk ]; then
            echo "✅ 配置成功"
            echo "=== 关键配置信息 ==="
            grep -E "CONF_NAME|JDK_VERSION|BOOT_JDK|ENABLE_CCACHE" build/*/spec.gmk || true
          else
            echo "❌ 配置失败"
            exit 1
          fi
      
      - name: 编译 JDK
        run: |
          echo "开始编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          START_TIME=$(date +%s)
          
          # 设置并行编译
          JOBS=$(nproc)
          echo "使用 ${JOBS} 个并行任务编译"
          
          # 设置 ccache
          export PATH="/usr/lib/ccache:$PATH"
          
          # 执行编译
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "🎯 使用完全缓存，执行增量编译"
            make images JOBS=${JOBS} JAVAC_FLAGS="-encoding UTF-8" CONF_CHECK=ignore
          elif [ -d build ] && [ -n "${{ steps.cache-build.outputs.cache-matched-key }}" ]; then
            echo "🔄 使用部分缓存，执行智能增量编译"
            # 清理可能过时的中间文件
            find build -name "*.d" -delete 2>/dev/null || true
            make images JOBS=${JOBS} JAVAC_FLAGS="-encoding UTF-8"
          else
            echo "📦 首次编译，执行完整构建"
            make images JOBS=${JOBS} JAVAC_FLAGS="-encoding UTF-8"
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          
          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "⏱️ 总编译耗时: ${MINUTES}分${SECONDS}秒"
          
          # 显示构建统计
          echo -e "\n=== 构建统计 ==="
          if [ -d build ]; then
            echo "构建目录大小: $(du -sh build/ | cut -f1)"
          fi
          
          echo -e "\nccache 统计:"
          ccache --show-stats || true
        timeout-minutes: 60
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      
      - name: 验证构建结果
        run: |
          if [ -d build/*/images/jdk ]; then
            echo "✅ JDK 编译成功！"
            echo ""
            echo "JDK 版本信息:"
            ./build/*/images/jdk/bin/java -version
            echo ""
            echo "构建产物大小:"
            du -sh build/*/images/jdk
            echo ""
            echo "完整构建目录大小:"
            du -sh build/
            echo ""
            
            # 显示缓存效果
            if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
              echo "💡 本次使用了完全缓存匹配，执行了最快的增量编译"
            elif [ -n "${{ steps.cache-build.outputs.cache-matched-key }}" ]; then
              echo "🔄 本次使用了部分缓存，仍然加速了编译过程"
            else
              echo "📦 本次从零开始完整编译，已为后续构建创建缓存"
            fi
          else
            echo "❌ JDK 编译失败：找不到输出目录"
            exit 1
          fi
      
      - name: 运行简单验证测试
        run: |
          echo "=== 测试 1: 验证 JDK 基本功能 ==="
          JDK_BIN=$(ls -d build/*/images/jdk/bin | head -1)
          
          echo "测试 java -version:"
          $JDK_BIN/java -version
          
          echo -e "\n测试 javac -version:"
          $JDK_BIN/javac -version
          
          echo -e "\n=== 测试 2: 编译并运行 Hello World ==="
          cat > /tmp/HelloWorld.java << 'EOF'
          public class HelloWorld {
              public static void main(String[] args) {
                  System.out.println("Hello from JDK 12!");
                  System.out.println("Java Version: " + System.getProperty("java.version"));
                  System.out.println("Java Vendor: " + System.getProperty("java.vendor"));
              }
          }
          EOF
          
          $JDK_BIN/javac /tmp/HelloWorld.java
          $JDK_BIN/java -cp /tmp HelloWorld
          
          echo -e "\n✅ 所有验证测试通过!"
        timeout-minutes: 5
      
      - name: 清理和优化缓存
        if: always()
        run: |
          # 清理不必要的文件以减小缓存大小
          if [ -d build ]; then
            echo "清理构建目录中的临时文件..."
            find build -name "*.o" -size +10M -delete 2>/dev/null || true
            find build -name "*.log" -delete 2>/dev/null || true
            find build -name "*.tmp" -delete 2>/dev/null || true
            echo "清理后的构建目录大小: $(du -sh build/ | cut -f1)"
          fi