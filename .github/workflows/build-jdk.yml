name: Build JDK

on:
  push:
    branches:
      - '**'  # 在所有分支上触发

jobs:
  build:
    name: 编译 JDK
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:x86_64-ubuntu-jdk-11.0.11_9
    outputs:
      source-hash: ${{ steps.source-hash.outputs.hash }}
      build-success: ${{ steps.verify-build.outputs.success }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 计算源代码哈希
        id: source-hash
        run: |
          # 基于文件内容的哈希（忽略时间戳）
          FILE_HASH=$(find src make -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.gmk" -o -name "*.mk" \) -print0 | \
            sort -z | \
            xargs -0 sha256sum | \
            awk '{print $1}' | \
            sha256sum | \
            cut -d' ' -f1 | \
            cut -c1-16)
          
          # 使用 GitHub 提供的 commit SHA
          GITHUB_SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-16)
          
          # 使用文件内容哈希作为主要标识（更稳定）
          echo "hash=${FILE_HASH}" >> $GITHUB_OUTPUT
          echo "github-sha=${GITHUB_SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "文件内容哈希: ${FILE_HASH}"
          echo "GitHub SHA: ${GITHUB_SHA_SHORT}"
      
      - name: 恢复构建缓存
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            build/
          key: jdk-build-v3-${{ runner.os }}-${{ steps.source-hash.outputs.hash }}
          restore-keys: |
            jdk-build-v3-${{ runner.os }}-${{ steps.source-hash.outputs.github-sha }}
            jdk-build-v3-${{ runner.os }}-
      
      - name: 显示缓存状态
        run: |
          echo "=== 缓存键信息 ==="
          echo "主键: jdk-build-v3-${{ runner.os }}-${{ steps.source-hash.outputs.hash }}"
          echo "GitHub SHA 备用键: jdk-build-v3-${{ runner.os }}-${{ steps.source-hash.outputs.github-sha }}"
          
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "🎯 缓存完全命中！将执行增量编译"
            if [ -d build ]; then
              echo "缓存的构建目录大小:"
              du -sh build/
              echo "缓存的构建时间:"
              ls -ld build/
              echo "缓存文件数量:"
              find build -type f | wc -l
            fi
          else
            echo "📦 无缓存或缓存未命中，将执行完整编译"
            echo "提示：首次构建后，后续构建将使用缓存加速"
          fi
          
      
      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            autoconf \
            zip \
            unzip \
            file \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libffi-dev
      
      - name: 显示环境信息
        run: |
          echo "Java 版本:"
          java -version
          echo "可用磁盘空间:"
          df -h
          echo "内存信息:"
          free -h
          echo "当前用户:"
          whoami
          echo "构建工具版本:"
          gcc --version | head -1
          make --version | head -1
      
      - name: 配置构建
        run: |
          # 即使缓存命中也运行配置，configure 会自动检测已有配置
          if [ -f build/*/spec.gmk ] && [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "检测到已有配置，configure 将快速完成..."
          fi
          
          bash configure \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --with-extra-cflags="-Wno-error" \
            --with-extra-cxxflags="-Wno-error" \
            --with-extra-ldflags="-Wl,-z,noexecstack" \
            --disable-javac-server
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          JAVAC_FLAGS: "-encoding UTF-8"
      
      - name: 显示配置信息
        run: |
          if [ -f build/*/spec.gmk ]; then
            if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
              echo "✅ 使用缓存的配置"
            else
              echo "✅ 配置成功完成"
            fi
            cat build/*/spec.gmk | grep -E "CONF_NAME|JDK_VERSION|BOOT_JDK"
          else
            echo "❌ 配置失败"
            exit 1
          fi
      
      - name: 编译 JDK
        run: |
          echo "开始编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          START_TIME=$(date +%s)
          
          # 设置并行编译
          JOBS=$(nproc)
          echo "使用 ${JOBS} 个并行任务编译"
          
          
          # 执行编译（make会自动检测已有产物并增量编译）
          if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
            echo "🎯 使用缓存，执行增量编译"
            make images JOBS=${JOBS} JAVAC_FLAGS="-encoding UTF-8 -XDignore.symbol.file -Xlint:none" WARNINGS_AS_ERRORS=false CONF_CHECK=ignore
          else
            echo "📦 首次编译，执行完整构建"
            make images JOBS=${JOBS} JAVAC_FLAGS="-encoding UTF-8 -XDignore.symbol.file -Xlint:none" WARNINGS_AS_ERRORS=false
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          
          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "⏱️ 总编译耗时: ${MINUTES}分${SECONDS}秒"
          
          # 显示构建统计
          if [ -d build ]; then
            echo "构建目录大小:"
            du -sh build/
          fi
          
        timeout-minutes: 60
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      
      - name: 验证构建结果
        id: verify-build
        run: |
          if [ -d build/*/images/jdk ]; then
            echo "✅ JDK 编译成功！"
            echo ""
            echo "JDK 版本信息:"
            ./build/*/images/jdk/bin/java -version
            echo ""
            echo "构建产物大小:"
            du -sh build/*/images/jdk
            echo ""
            echo "完整构建目录大小:"
            du -sh build/
            echo ""
            
            # 显示增量编译效果
            if [ "${{ steps.cache-build.outputs.cache-hit }}" = "true" ]; then
              echo "💡 本次使用了缓存，执行了增量编译"
            else
              echo "📦 本次从零开始完整编译，下次将可以使用增量编译"
            fi
            
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ JDK 编译失败：找不到输出目录"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: 运行简单验证测试
        run: |
          echo "=== 测试 1: 验证 JDK 基本功能 ==="
          JDK_BIN=$(ls -d build/*/images/jdk/bin | head -1)
          
          echo "测试 java -version:"
          $JDK_BIN/java -version
          
          echo -e "\n测试 javac -version:"
          $JDK_BIN/javac -version
          
          echo -e "\n=== 测试 2: 编译并运行 Hello World ==="
          cat > /tmp/HelloWorld.java << 'EOF'
          public class HelloWorld {
              public static void main(String[] args) {
                  System.out.println("Hello from JDK 12!");
                  System.out.println("Java Version: " + System.getProperty("java.version"));
                  System.out.println("Java Vendor: " + System.getProperty("java.vendor"));
              }
          }
          EOF
          
          $JDK_BIN/javac /tmp/HelloWorld.java
          $JDK_BIN/java -cp /tmp HelloWorld
          
          echo -e "\n=== 测试 3: 测试 jar 工具 ==="
          $JDK_BIN/jar --version
          
          echo -e "\n=== 测试 4: 测试基本 Java API ==="
          cat > /tmp/ApiTest.java << 'EOF'
          import java.util.*;
          import java.io.*;
          public class ApiTest {
              public static void main(String[] args) {
                  // 测试集合框架
                  List<String> list = new ArrayList<>();
                  list.add("Test");
                  System.out.println("ArrayList test: " + list.size());
                  
                  // 测试字符串操作
                  String str = "Hello JDK";
                  System.out.println("String test: " + str.toUpperCase());
                  
                  // 测试文件I/O
                  File tmpFile = new File("/tmp/test.txt");
                  System.out.println("File API test: " + tmpFile.getAbsolutePath());
                  
                  System.out.println("✅ 所有基础API测试通过!");
              }
          }
          EOF
          
          $JDK_BIN/javac /tmp/ApiTest.java
          $JDK_BIN/java -cp /tmp ApiTest
          
          echo -e "\n=== 测试 5: 验证模块系统 ==="
          $JDK_BIN/java --list-modules | head -10
          
          echo -e "\n✅ 所有简单验证测试通过!"
        timeout-minutes: 5
      
      - name: 准备构建产物
        run: |
          echo "=== 准备构建产物用于上传 ==="
          
          # 创建产物目录
          mkdir -p artifacts
          
          # 复制JDK构建产物
          if [ -d build/*/images/jdk ]; then
            JDK_DIR=$(ls -d build/*/images/jdk | head -1)
            echo "复制JDK目录: $JDK_DIR"
            cp -r $JDK_DIR artifacts/jdk
            echo "JDK产物大小:"
            du -sh artifacts/jdk
          fi
          
          # 复制JRE构建产物（如果存在）
          if [ -d build/*/images/jre ]; then
            JRE_DIR=$(ls -d build/*/images/jre | head -1)
            echo "复制JRE目录: $JRE_DIR"
            cp -r $JRE_DIR artifacts/jre
            echo "JRE产物大小:"
            du -sh artifacts/jre
          fi
          
          # 创建构建信息文件
          cat > artifacts/build-info.txt << EOF
构建时间: $(date '+%Y-%m-%d %H:%M:%S')
Git提交: ${{ github.sha }}
分支: ${{ github.ref_name }}
工作流: ${{ github.workflow }}
运行器: ${{ runner.os }}
Java版本: $(java -version 2>&1 | head -1)
构建配置: ${{ steps.source-hash.outputs.hash }}
EOF
          
          # 显示产物信息
          echo "=== 构建产物信息 ==="
          ls -la artifacts/
          echo ""
          echo "产物总大小:"
          du -sh artifacts/
          echo ""
          echo "构建信息:"
          cat artifacts/build-info.txt
      
      - name: 上传JDK构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jdk-build-artifacts-${{ steps.source-hash.outputs.hash }}
          path: artifacts/
          retention-days: 30
          compression-level: 6
      
      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ steps.source-hash.outputs.hash }}
          path: |
            build/*/support/global.log
            build/*/support/configure.log
          retention-days: 7
          compression-level: 6

  download-artifacts:
    name: 下载构件
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: 获取构建哈希
        id: get-hash
        run: |
          # 从构建job获取哈希值
          echo "构建job状态: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "hash=${{ needs.build.outputs.source-hash }}" >> $GITHUB_OUTPUT
            echo "使用构建哈希: ${{ needs.build.outputs.source-hash }}"
          else
            echo "构建失败，使用当前提交SHA"
            echo "hash=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "使用提交SHA: ${{ github.sha }}"
          fi
      
      - name: 下载JDK构建产物
        uses: actions/download-artifact@v4
        with:
          name: jdk-build-artifacts-${{ steps.get-hash.outputs.hash }}
          path: downloaded-artifacts/
        continue-on-error: true
      
      - name: 显示下载的构件信息
        run: |
          echo "=== 下载的构件信息 ==="
          if [ -d downloaded-artifacts ] && [ "$(ls -A downloaded-artifacts)" ]; then
            echo "✅ 成功下载构件"
            echo "构件目录内容:"
            ls -la downloaded-artifacts/
            echo ""
            echo "构件大小:"
            du -sh downloaded-artifacts/
            echo ""
            if [ -f downloaded-artifacts/build-info.txt ]; then
              echo "构建信息:"
              cat downloaded-artifacts/build-info.txt
            fi
            echo ""
            if [ -d downloaded-artifacts/jdk ]; then
              echo "JDK版本信息:"
              downloaded-artifacts/jdk/bin/java -version
            fi
          else
            echo "❌ 未找到下载的构件"
            echo "可能的原因:"
            echo "1. 构建失败，没有生成构件"
            echo "2. 构件名称不匹配"
            echo "3. 构件已过期被删除"
            echo ""
            echo "尝试查找可用的构件:"
            echo "当前分支: ${{ github.ref_name }}"
            echo "当前提交: ${{ github.sha }}"
            echo "构建状态: ${{ needs.build.result }}"
          fi
      
      - name: 创建构件压缩包
        run: |
          if [ -d downloaded-artifacts ] && [ "$(ls -A downloaded-artifacts)" ]; then
            echo "=== 创建构件压缩包 ==="
            cd downloaded-artifacts
            tar -czf ../jdk-artifacts-${{ github.sha }}.tar.gz .
            cd ..
            echo "压缩包大小:"
            ls -lh jdk-artifacts-*.tar.gz
            echo "压缩包创建完成: jdk-artifacts-${{ github.sha }}.tar.gz"
          else
            echo "⚠️ 没有构件可压缩"
          fi
      
      - name: 上传构件压缩包
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jdk-compressed-artifacts-${{ github.sha }}
          path: jdk-artifacts-*.tar.gz
          retention-days: 30