name: Build JDK

on:
  push:
    branches:
      - '**'  # 在所有分支上触发

jobs:
  build:
    name: 编译 JDK
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:x86_64-ubuntu-jdk-11.0.11_9
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            autoconf \
            zip \
            unzip \
            file \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libffi-dev
      
      - name: 显示环境信息
        run: |
          echo "Java 版本:"
          java -version
          echo "可用磁盘空间:"
          df -h
          echo "内存信息:"
          free -h
          echo "当前用户:"
          whoami
          echo "构建工具版本:"
          gcc --version | head -1
          make --version | head -1
      
      - name: 配置构建
        run: |
          bash configure \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --with-extra-cflags="-Wno-error" \
            --with-extra-cxxflags="-Wno-error"
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      
      - name: 显示配置信息
        run: |
          if [ -f build/*/spec.gmk ]; then
            echo "✅ 配置成功完成"
            cat build/*/spec.gmk | grep -E "CONF_NAME|JDK_VERSION|BOOT_JDK"
          else
            echo "❌ 配置失败"
            exit 1
          fi
      
      - name: 编译 JDK
        run: |
          make images
        timeout-minutes: 60
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      
      - name: 验证构建结果
        run: |
          if [ -d build/*/images/jdk ]; then
            echo "✅ JDK 编译成功！"
            echo "JDK 版本信息:"
            ./build/*/images/jdk/bin/java -version
            echo "构建产物大小:"
            du -sh build/*/images/jdk
          else
            echo "❌ JDK 编译失败：找不到输出目录"
            exit 1
          fi
      
      - name: 运行基础测试
        run: |
          make run-test-tier1
        continue-on-error: true  # 测试失败不影响 workflow 状态
        timeout-minutes: 30
