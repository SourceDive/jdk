name: Build JDK

on:
  push:
    branches:
      - '**'  # 在所有分支上触发

jobs:
  build:
    name: 编译 JDK
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:x86_64-ubuntu-jdk-11.0.11_9
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 计算源代码哈希
        id: source-hash
        run: |
          # 计算关键源文件的哈希值
          SOURCE_HASH=$(find src make -type f \( -name "*.java" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.gmk" -o -name "*.mk" \) -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "hash=${SOURCE_HASH}" >> $GITHUB_OUTPUT
          echo "源代码哈希: ${SOURCE_HASH}"
      
      - name: 恢复构建缓存
        id: cache-build
        uses: actions/cache@v3
        with:
          path: |
            build/
          key: jdk-build-${{ runner.os }}-${{ steps.source-hash.outputs.hash }}
          restore-keys: |
            jdk-build-${{ runner.os }}-
      
      - name: 调试缓存输出
        run: |
          echo "=== 缓存调试信息 ==="
          echo "cache-hit 输出值: '${{ steps.cache-build.outputs.cache-hit }}'"
          echo "cache-matched-key: '${{ steps.cache-build.outputs.cache-matched-key }}'"
          echo "cache-primary-key: 'jdk-build-${{ runner.os }}-${{ steps.source-hash.outputs.hash }}'"
          echo "==================="
      
      - name: 显示缓存状态
        run: |
          echo "缓存命中状态: '${{ steps.cache-build.outputs.cache-hit }}'"
          if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
            echo "🎯 缓存命中！将执行增量编译"
            if [ -d build ]; then
              echo "缓存的构建目录大小:"
              du -sh build/
              echo "缓存的构建时间:"
              ls -ld build/
            fi
          else
            echo "📦 无缓存或缓存未命中，将执行完整编译"
          fi
      
      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            autoconf \
            zip \
            unzip \
            file \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libffi-dev
      
      - name: 显示环境信息
        run: |
          echo "Java 版本:"
          java -version
          echo "可用磁盘空间:"
          df -h
          echo "内存信息:"
          free -h
          echo "当前用户:"
          whoami
          echo "构建工具版本:"
          gcc --version | head -1
          make --version | head -1
      
      - name: 配置构建
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          bash configure \
            --with-debug-level=release \
            --disable-warnings-as-errors \
            --with-extra-cflags="-Wno-error" \
            --with-extra-cxxflags="-Wno-error" \
            --with-extra-ldflags="-Wl,-z,noexecstack"
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          JAVAC_FLAGS: "-encoding UTF-8"
      
      - name: 显示配置信息
        run: |
          if [ -f build/*/spec.gmk ]; then
            if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
              echo "✅ 使用缓存的配置"
            else
              echo "✅ 配置成功完成"
            fi
            cat build/*/spec.gmk | grep -E "CONF_NAME|JDK_VERSION|BOOT_JDK"
          else
            echo "❌ 配置失败"
            exit 1
          fi
      
      - name: 编译 JDK
        run: |
          echo "开始编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          START_TIME=$(date +%s)
          
          # 执行编译（make会自动检测已有产物并增量编译）
          if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
            echo "🎯 使用缓存，跳过配置检查"
            make images JAVAC_FLAGS="-encoding UTF-8" CONF_CHECK=ignore
          else
            echo "📦 首次编译，执行完整构建"
            make images JAVAC_FLAGS="-encoding UTF-8"
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          
          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "⏱️ 总编译耗时: ${MINUTES}分${SECONDS}秒"
          
          # 显示构建统计
          if [ -d build ]; then
            echo "构建目录大小:"
            du -sh build/
          fi
        timeout-minutes: 60
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
      
      - name: 验证构建结果
        run: |
          if [ -d build/*/images/jdk ]; then
            echo "✅ JDK 编译成功！"
            echo ""
            echo "JDK 版本信息:"
            ./build/*/images/jdk/bin/java -version
            echo ""
            echo "构建产物大小:"
            du -sh build/*/images/jdk
            echo ""
            echo "完整构建目录大小:"
            du -sh build/
            echo ""
            
            # 显示增量编译效果
            if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
              echo "💡 本次使用了缓存，执行了增量编译"
            else
              echo "📦 本次从零开始完整编译，下次将可以使用增量编译"
            fi
          else
            echo "❌ JDK 编译失败：找不到输出目录"
            exit 1
          fi
      
      - name: 运行简单验证测试
        run: |
          echo "=== 测试 1: 验证 JDK 基本功能 ==="
          JDK_BIN=$(ls -d build/*/images/jdk/bin | head -1)
          
          echo "测试 java -version:"
          $JDK_BIN/java -version
          
          echo -e "\n测试 javac -version:"
          $JDK_BIN/javac -version
          
          echo -e "\n=== 测试 2: 编译并运行 Hello World ==="
          cat > /tmp/HelloWorld.java << 'EOF'
          public class HelloWorld {
              public static void main(String[] args) {
                  System.out.println("Hello from JDK 12!");
                  System.out.println("Java Version: " + System.getProperty("java.version"));
                  System.out.println("Java Vendor: " + System.getProperty("java.vendor"));
              }
          }
          EOF
          
          $JDK_BIN/javac /tmp/HelloWorld.java
          $JDK_BIN/java -cp /tmp HelloWorld
          
          echo -e "\n=== 测试 3: 测试 jar 工具 ==="
          $JDK_BIN/jar --version
          
          echo -e "\n=== 测试 4: 测试基本 Java API ==="
          cat > /tmp/ApiTest.java << 'EOF'
          import java.util.*;
          import java.io.*;
          public class ApiTest {
              public static void main(String[] args) {
                  // 测试集合框架
                  List<String> list = new ArrayList<>();
                  list.add("Test");
                  System.out.println("ArrayList test: " + list.size());
                  
                  // 测试字符串操作
                  String str = "Hello JDK";
                  System.out.println("String test: " + str.toUpperCase());
                  
                  // 测试文件I/O
                  File tmpFile = new File("/tmp/test.txt");
                  System.out.println("File API test: " + tmpFile.getAbsolutePath());
                  
                  System.out.println("✅ 所有基础API测试通过!");
              }
          }
          EOF
          
          $JDK_BIN/javac /tmp/ApiTest.java
          $JDK_BIN/java -cp /tmp ApiTest
          
          echo -e "\n=== 测试 5: 验证模块系统 ==="
          $JDK_BIN/java --list-modules | head -10
          
          echo -e "\n✅ 所有简单验证测试通过!"
        timeout-minutes: 5
